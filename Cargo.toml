# ---
# why: This file names the bininfo crate and its dependency.
# uses: cargo
# how: Cargo reads this file to build bininfo.
# ---

[package]
name = "bininfo"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Read an ELF, Mach-O, or PE header and check how the file starts. Also read a zip, a disk image, a TIFF file, and an MPQ archive."

[dependencies]
crossterm = "0.28"

[lib]
name = "bininfo"
path = "src/lib.rs"

[[bin]]
name = "bininfo"
path = "src/main.rs"
